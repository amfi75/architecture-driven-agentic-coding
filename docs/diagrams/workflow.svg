<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-label="ADAC: architecture enables accountable parallel development"><title>ADAC: architecture enables accountable parallel development</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#36536b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#18344a">
<text x="500" y="36" text-anchor="middle" font-size="26" font-weight="bold">Architecture-Driven Agentic Coding</text>
<text x="500" y="65" text-anchor="middle" font-size="16" font-weight="normal">Initial substantial work; subsequent changes reuse suitable architecture</text>
<rect x="390" y="85" width="220" height="45" rx="12" fill="#dcefe8" stroke="#6a879d" stroke-width="1.5"/>
<text x="500.0" y="112" text-anchor="middle" font-size="18" font-weight="bold">START</text>
<path d="M500 130 V153" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="155" width="580" height="95" rx="12" fill="#ffffff" stroke="#6a879d" stroke-width="1.5"/>
<text x="500.0" y="182" text-anchor="middle" font-size="18" font-weight="bold">1 · Understand requirements and system</text>
<text x="500.0" y="207" text-anchor="middle" font-size="16" font-weight="normal">Outcome, quality, constraints and acceptance</text>
<text x="500.0" y="230" text-anchor="middle" font-size="16" font-weight="normal">Recover relevant architecture and authorized delivery state</text>
<path d="M500 250 V277" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="290" y="279" width="420" height="72" rx="12" fill="#e4eef9" stroke="#6a879d" stroke-width="1.5"/>
<text x="500.0" y="306" text-anchor="middle" font-size="18" font-weight="bold">Does modular coordination help?</text>
<text x="500.0" y="331" text-anchor="middle" font-size="16" font-weight="normal">Decide before assigning agents</text>
<path d="M710 315 H783" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="745" y="303" text-anchor="middle" font-size="15" font-weight="normal">No</text>
<rect x="785" y="279" width="195" height="95" rx="12" fill="#edf1f4" stroke="#6a879d" stroke-width="1.5"/>
<text x="882.5" y="306" text-anchor="middle" font-size="18" font-weight="bold">Ordinary work</text>
<text x="882.5" y="331" text-anchor="middle" font-size="16" font-weight="normal">Proportionate</text>
<text x="882.5" y="354" text-anchor="middle" font-size="16" font-weight="normal">local practices</text>
<path d="M500 351 V383" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="529" y="373" text-anchor="middle" font-size="15" font-weight="normal">Yes</text>
<rect x="180" y="385" width="640" height="112" rx="12" fill="#ffffff" stroke="#6a879d" stroke-width="1.5"/>
<text x="500.0" y="412" text-anchor="middle" font-size="18" font-weight="bold">2 · Establish or refine the architecture</text>
<text x="500.0" y="437" text-anchor="middle" font-size="16" font-weight="normal">Functional capabilities ↔ software components and interfaces</text>
<text x="500.0" y="460" text-anchor="middle" font-size="16" font-weight="normal">Quality + constraints → cohesive, independent boundaries</text>
<text x="500.0" y="483" text-anchor="middle" font-size="16" font-weight="normal">Record mappings, rationale, owners and acceptance</text>
<path d="M500 497 V525" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="527" width="580" height="94" rx="12" fill="#fff1d8" stroke="#6a879d" stroke-width="1.5"/>
<text x="500.0" y="554" text-anchor="middle" font-size="18" font-weight="bold">Review the complete initial plan</text>
<text x="500.0" y="579" text-anchor="middle" font-size="16" font-weight="normal">Independent review → repair gaps → user approval</text>
<text x="500.0" y="602" text-anchor="middle" font-size="16" font-weight="normal">For substantial work; no repeat gate for internal corrections</text>
<path d="M500 621 V649" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="651" width="580" height="95" rx="12" fill="#e4eef9" stroke="#6a879d" stroke-width="1.5"/>
<text x="500.0" y="678" text-anchor="middle" font-size="18" font-weight="bold">3 · Orchestrator coordinates delivery</text>
<text x="500.0" y="703" text-anchor="middle" font-size="16" font-weight="normal">Maintains system understanding and authoritative records</text>
<text x="500.0" y="726" text-anchor="middle" font-size="16" font-weight="normal">Coordinates shared decisions, contracts and integration</text>
<path d="M500 746 V778 H275 V803" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 778 H725 V803" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="100" y="805" width="350" height="95" rx="12" fill="#ffffff" stroke="#6a879d" stroke-width="1.5"/>
<text x="275.0" y="832" text-anchor="middle" font-size="18" font-weight="bold">Component owner A</text>
<text x="275.0" y="857" text-anchor="middle" font-size="16" font-weight="normal">Research, design and accountability</text>
<text x="275.0" y="880" text-anchor="middle" font-size="16" font-weight="normal">Implements or delegates within authority</text>
<rect x="550" y="805" width="350" height="95" rx="12" fill="#ffffff" stroke="#6a879d" stroke-width="1.5"/>
<text x="725.0" y="832" text-anchor="middle" font-size="18" font-weight="bold">Component owner B</text>
<text x="725.0" y="857" text-anchor="middle" font-size="16" font-weight="normal">Research, design and accountability</text>
<text x="725.0" y="880" text-anchor="middle" font-size="16" font-weight="normal">Independent work can run in parallel</text>
<path d="M275 903 V927" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M725 903 V927" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="130" y="930" width="290" height="85" rx="12" fill="#e4eef9" stroke="#6a879d" stroke-width="1.5"/>
<text x="275.0" y="957" text-anchor="middle" font-size="18" font-weight="bold">Bounded worker tasks</text>
<text x="275.0" y="982" text-anchor="middle" font-size="16" font-weight="normal">Established design + checks</text>
<text x="275.0" y="1005" text-anchor="middle" font-size="16" font-weight="normal">Questions and results → owner</text>
<rect x="580" y="930" width="290" height="85" rx="12" fill="#e4eef9" stroke="#6a879d" stroke-width="1.5"/>
<text x="725.0" y="957" text-anchor="middle" font-size="18" font-weight="bold">Bounded worker tasks</text>
<text x="725.0" y="982" text-anchor="middle" font-size="16" font-weight="normal">Established design + checks</text>
<text x="725.0" y="1005" text-anchor="middle" font-size="16" font-weight="normal">Questions and results → owner</text>
<path d="M100 850 H70 V1070 H500 V1103" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M900 850 H930 V1070 H500" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="1046" text-anchor="middle" font-size="15" font-weight="normal">Owners evaluate worker results and retain integration accountability</text>
<text x="500" y="1330" text-anchor="middle" font-size="15" font-weight="normal">Roles can be combined; delegation requires actual host permission</text>
<rect x="180" y="1105" width="640" height="95" rx="12" fill="#ffffff" stroke="#6a879d" stroke-width="1.5"/>
<text x="500.0" y="1132" text-anchor="middle" font-size="18" font-weight="bold">4 · Integrate, verify, validate and review</text>
<text x="500.0" y="1157" text-anchor="middle" font-size="16" font-weight="normal">Observe intended use and preservation; challenge actual evidence</text>
<text x="500.0" y="1180" text-anchor="middle" font-size="16" font-weight="normal">Correct failures via the return paths; update architectural records</text>
<path d="M500 1200 V1233" fill="none" stroke="#36536b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="715" y="1223" text-anchor="middle" font-size="14" font-weight="normal">All required criteria and review pass</text>
<rect x="270" y="1235" width="460" height="70" rx="12" fill="#dcefe8" stroke="#6a879d" stroke-width="1.5"/>
<text x="500.0" y="1262" text-anchor="middle" font-size="18" font-weight="bold">END · Complete agreed outcome</text>
<text x="500.0" y="1287" text-anchor="middle" font-size="16" font-weight="normal">Handoff result, architecture and evidence</text>
<text x="500" y="1355" text-anchor="middle" font-size="15" font-weight="normal">For incremental work: delta + preserve + impact + evidence; revisit only affected design.</text>
<text x="500" y="1380" text-anchor="middle" font-size="15" font-weight="normal">No controller. The core defines the rules; the loop diagram expands the correction paths.</text>
</g></svg>
